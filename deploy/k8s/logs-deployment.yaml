# logs 服务端 Deployment（单实例 / 带 PVC 持久化）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ydsz-trace-logs-data
  namespace: ydsz-trace
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-trace-logs
  namespace: ydsz-trace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ydsz-trace-logs
  template:
    metadata:
      labels:
        app: ydsz-trace-logs
    spec:
      containers:
        - name: logs
          image: ydsz-trace/logs:latest
          ports:
            - containerPort: 2021
          env:
            - name: YDSZ_ADMIN_USER
              value: "admin"
            - name: YDSZ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ydsz-trace-secrets
                  key: admin-password
            - name: YDSZ_DB_PATH
              value: "/app/data/ydsz_trace.db"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 2021
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 2021
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ydsz-trace-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-trace-logs
  namespace: ydsz-trace
spec:
  selector:
    app: ydsz-trace-logs
  ports:
    - port: 2021
      targetPort: 2021
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: ydsz-trace-secrets
  namespace: ydsz-trace
type: Opaque
stringData:
  admin-password: "PLEASE_CHANGE_ME_TO_A_STRONG_SECRET"
