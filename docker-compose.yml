version: "3.8"

services:
  # ========== 服务端 ==========
  logs:
    build:
      context: .
      dockerfile: logs/Dockerfile
    container_name: ydsz-trace-logs
    environment:
      YDSZ_ADMIN_USER: ${YDSZ_ADMIN_USER:-admin}
      YDSZ_ADMIN_PASSWORD: ${YDSZ_ADMIN_PASSWORD:-ydsz_trace_admin}
      YDSZ_DB_PATH: /app/data/ydsz_trace.db
      YDSZ_WEB_ROOT: ${YDSZ_WEB_ROOT:-/app/web/dist}
      TZ: Asia/Shanghai
    ports:
      - "2021:2021"
    volumes:
      - logs-data:/app/data
      - logs-temp:/app/temp/logs
    restart: unless-stopped

  # ========== 客户端代理（示例） ==========
  logc:
    build:
      context: .
      dockerfile: logc/Dockerfile
    container_name: ydsz-trace-logc
    depends_on:
      - logs
    environment:
      YDSZ_LOG_SERVER: logs:2021
      YDSZ_CLIENT_KEY: ${YDSZ_CLIENT_KEY:-ydsz_trace_key}
      YDSZ_CORS_ORIGINS: ${YDSZ_CORS_ORIGINS:-http://localhost:*}
      TZ: Asia/Shanghai
    ports:
      - "2020:2020"
    volumes:
      - logc-temp:/app/temp/logc
      # 将宿主机日志目录挂载进来（按需配置）
      # - /var/log:/var/log:ro
    restart: unless-stopped

volumes:
  logs-data:
  logs-temp:
  logc-temp:
