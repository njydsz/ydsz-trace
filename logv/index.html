<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ydsz Trace 控制台</title>
    <script>
      // 主题预渲染脚本：在 Vue 应用启动前读取 localStorage 偏好并设置 data-theme，
      // 避免页面加载时出现主题闪烁。
      (function() {
        try {
          var pref = localStorage.getItem('ydsz-theme-preference') || 'system';
          if (pref === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
