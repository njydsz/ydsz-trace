name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 取消正在进行中的同 PR/分支工作流，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== Go 静态检查 + 测试 + 构建 ==========
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, logs, logc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            pkg/go.sum
            logs/go.sum
            logc/go.sum
            go.work.sum

      - name: Module workspace sync
        run: go work sync

      - name: go vet (${{ matrix.module }})
        run: cd ${{ matrix.module }} && go vet ./...

      - name: Run tests with race + coverage (${{ matrix.module }})
        run: cd ${{ matrix.module }} && go test -race -coverprofile=coverage.out ./...
        continue-on-error: ${{ matrix.module == 'logs' }}

      - name: Upload coverage artifact
        if: matrix.module == 'pkg'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pkg
          path: pkg/coverage.out

  # ========== golangci-lint 全面静态分析 ==========
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint (pkg)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: pkg
          args: --timeout=5m

      - name: Run golangci-lint (logs)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: logs
          args: --timeout=5m

      - name: Run golangci-lint (logc)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: logc
          args: --timeout=5m

  # ========== Go 漏洞扫描 ==========
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (pkg)
        run: govulncheck ./pkg/...

      - name: Run govulncheck (logs)
        run: govulncheck ./logs/...

      - name: Run govulncheck (logc)
        run: govulncheck ./logc/...

  # ========== 前端构建验证 ==========
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

  # ========== 发布 v* 标签时构建 Docker 镜像 ==========
  release-docker:
    name: Docker Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, lint, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [logs, logc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
