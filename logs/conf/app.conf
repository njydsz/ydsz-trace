appname = ydsz-trace-logs
httpport = 2021
runmode = dev
#开启 session
sessionon = true
# 用于接收json请求
copyrequestbody = true

# 管理员账号（生产环境请务必修改）
username = admin
password = change_me_production

# 临时目录（请根据实际环境修改）
temppath = ./temp/logs/

# 数据库配置
sqlhost = 127.0.0.1
sqlport = 3306
sqluser = root
sqlpwd = change_me_production
database = ydsz_trace
maxIdleConns = 10
maxOpenConns = 50

# 轮训客户端的时间间隔,默认5分钟一次
cron = 0 0/5 * * * *
