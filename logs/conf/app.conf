appname = ydsz-trace-logs
httpport = 2021
runmode = dev
#开启 session
sessionon = true
# 用于接收json请求
copyrequestbody = true

# 管理员账号（生产环境请务必修改）
username = admin
password = change_me_production

# 临时目录（请根据实际环境修改）
temppath = ./temp/logs/

# SQLite 数据库文件路径
# 可使用环境变量 YDSZ_DB_PATH 覆盖
dbpath = ./data/ydsz_trace.db

# 轮训客户端的时间间隔,默认5分钟一次
cron = 0 0/5 * * * *
