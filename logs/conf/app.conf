appname = ydsz-trace-logs
httpport = 2021
runmode = dev
#开启 session
sessionon = true
# 用于接收json请求
copyrequestbody = true

# 管理员账号（生产环境请务必修改）
username = admin
password = change_me_production

# 临时目录（请根据实际环境修改）
temppath = ./temp/logs/

# SQLite 数据库文件路径
# 可使用环境变量 YDSZ_DB_PATH 覆盖
dbpath = ./data/ydsz_trace.db

# 轮训客户端的时间间隔,默认5分钟一次
cron = 0 0/5 * * * *

# Redis 配置（可选）。未配置时使用进程内存后端（单副本模式）。
# 设置后自动启用 Redis 会话 + 限流，多副本部署时共享状态。
# redisaddr = 127.0.0.1:6379
# redispwd =
# redisdb = 0
